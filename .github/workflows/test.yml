# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test

on: [push, pull_request, workflow_dispatch]

permissions: {}

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
      with:
          persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

    - name: Install dependencies
      run: |
        make .venv
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}

    - name: Run checks
      run: |
        make check

    - name: Build coverage report
      if: matrix.python-version == '3.10'
      run: |
        .venv/bin/python -m coverage xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  native-parity:
    # Build the Rust parser module and run the full suite against it on the
    # newest interpreter. The parser parity tests skip when the native module
    # is absent, so with the module installed they exercise the native path
    # and fail if it diverges from the interpreter's ast.parse. Coverage is
    # still reported from the 3.10 native-free job above.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
          persist-credentials: false

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Install maturin
      run: pipx install maturin

    - name: Build the native module into a scratch venv
      run: |
        python3.14 -m venv .venv-maturin
        .venv-maturin/bin/pip install maturin pytest pytest-cov pytest-xdist pyyaml
        VIRTUAL_ENV=$PWD/.venv-maturin .venv-maturin/bin/maturin develop --release

    - name: Run parser parity tests against the native module
      run: |
        .venv-maturin/bin/python -m pytest tests/parser -q

    - name: Run the test suite with the native module installed
      # The 100%-changed-line coverage gate applies to the Python fallback and
      # stays reported from the 3.10 native-free job; the native run skips it.
      run: |
        .venv-maturin/bin/python -m pytest -q -o addopts=""
