# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test

on: [push, pull_request, workflow_dispatch]

permissions: {}

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
      with:
          persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

    - name: Install dependencies
      run: |
        make .venv
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}

    - name: Run checks
      run: |
        make check

    - name: Build coverage report
      if: matrix.python-version == '3.10'
      run: |
        .venv/bin/python -m coverage xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # D8 wheel matrix: one native `abi3-py310` wheel per platform. These jobs
  # only build wheels; `make check` above stays native-free so the pure-Python
  # fallback paths remain exercised.
  wheel:
    name: Build native wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux-x86_64
          - os: macos-latest
            platform: macosx-arm64
          - os: windows-latest
            platform: windows-x86_64

    steps:
    - uses: actions/checkout@v7
      with:
          persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
          python-version: "3.10"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build abi3-py310 wheel
      run: maturin build --release --out dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: deadcode-${{ matrix.platform }}
        path: dist/*.whl
