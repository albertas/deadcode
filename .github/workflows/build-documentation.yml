# This workflow builds the project documentation on Read the Docs without a manual action:
# it runs the helper tests and, for a push to main, ensures and follows a "latest" build;
# for a pushed X.Y.Z tag it builds that version and re-renders stable from it.
# For more information see the trigger_readthedocs_builds.py helper in .github/scripts/.

name: Build documentation

on:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]*.[0-9]*.[0-9]*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Read the Docs version to build (default: latest)"
        required: false
        type: string
      commit:
        description: "Commit to build (default: the dispatched commit)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "documentation-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  helper-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
          persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
          python-version: "3.12"

    - name: Run documentation helper tests
      run: |
        python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  latest:
    needs: helper-tests
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
          persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
          python-version: "3.12"

    - name: Check the Read the Docs token
      env:
        READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
      run: |
        if [ -z "$READTHEDOCS_API_TOKEN" ]; then
          echo "READTHEDOCS_API_TOKEN is not set." >&2
          echo "Add it as a repository secret under Settings -> Secrets and variables -> Actions (prerequisite P2, described in the Documentation builds section of README.md)." >&2
          exit 1
        fi

    - name: Build latest documentation
      env:
        READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
      run: |
        python3 .github/scripts/trigger_readthedocs_builds.py --version latest --commit "${{ github.sha }}"

  release:
    needs: helper-tests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
          persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
          python-version: "3.12"

    - name: Check the Read the Docs token
      env:
        READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
      run: |
        if [ -z "$READTHEDOCS_API_TOKEN" ]; then
          echo "READTHEDOCS_API_TOKEN is not set." >&2
          echo "Add it as a repository secret under Settings -> Secrets and variables -> Actions (prerequisite P2, described in the Documentation builds section of README.md)." >&2
          exit 1
        fi

    - name: Build the released version and stable documentation
      env:
        READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        python3 .github/scripts/trigger_readthedocs_builds.py --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --expect-stable-ref "$GITHUB_REF_NAME" --wait-for-version 120

  dispatch:
    needs: helper-tests
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
          persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
          python-version: "3.12"

    - name: Check the Read the Docs token
      env:
        READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
      run: |
        if [ -z "$READTHEDOCS_API_TOKEN" ]; then
          echo "READTHEDOCS_API_TOKEN is not set." >&2
          echo "Add it as a repository secret under Settings -> Secrets and variables -> Actions (prerequisite P2, described in the Documentation builds section of README.md)." >&2
          exit 1
        fi

    - name: Build the dispatched documentation version
      env:
        READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
        DISPATCH_VERSION: ${{ inputs.version }}
        DISPATCH_COMMIT: ${{ inputs.commit }}
        DISPATCH_SHA: ${{ github.sha }}
      run: |
        version="${DISPATCH_VERSION:-latest}"
        commit="${DISPATCH_COMMIT:-$DISPATCH_SHA}"
        arguments=(--version "$version" --commit "$commit")
        if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          arguments+=(--expect-stable-ref "$version")
        fi
        python3 .github/scripts/trigger_readthedocs_builds.py "${arguments[@]}"
