[project]
name = "deadcode"
version = "2.3.0"
authors = [
    {name = "Albertas Gimbutas", email = "albertasgim@gmail.com"},
]
description = "Find and remove dead code."
readme = "README.md"
requires-python = ">= 3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.14.0",
    "ast-serialize==0.5.0",
    "attrs==26.1.0",
    "backports-tarfile==1.2.0 ; python_full_version < '3.12'",
    "backports-zstd==1.6.0 ; python_full_version < '3.14'",
    "boolean-py==5.0",
    "cachecontrol==0.14.4",
    "certifi==2026.6.17",
    "cffi==2.0.0 ; platform_python_implementation != 'PyPy'",
    "charset-normalizer==3.4.7",
    "claude-agent-sdk==0.2.105",
    "click==8.4.1",
    "coverage==7.14.2",
    "cryptography==49.0.0",
    "cyclonedx-python-lib==11.11.0",
    "defusedxml==0.7.1",
    "distlib==0.4.3",
    "distro==1.9.0 ; sys_platform == 'linux'",
    "execnet==2.1.2",
    "filelock==3.29.4",
    "h11==0.16.0",
    "hatch==1.17.0",
    "hatchling==1.30.1",
    "httpcore==1.0.9",
    "httpcore2==2.4.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "httpx2==2.4.0",
    "hyperlink==21.0.0",
    "idna==3.18",
    "importlib-metadata==9.0.0 ; python_full_version < '3.12'",
    "iniconfig==2.3.0",
    "jaraco-classes==3.4.0",
    "jaraco-context==6.1.2",
    "jaraco-functools==4.5.0",
    "jeepney==0.9.0 ; sys_platform == 'linux'",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "keyring==25.7.0",
    "librt==0.11.0 ; platform_python_implementation != 'PyPy'",
    "license-expression==30.4.4",
    "markdown-it-py==4.2.0",
    "mcp==1.28.0",
    "mdurl==0.1.2",
    "more-itertools==11.1.0",
    "msgpack==1.2.1",
    "mypy==2.1.0",
    "mypy-extensions==1.1.0",
    "networkx==3.6.1",
    "packageurl-python==0.17.6",
    "packaging==26.2",
    "pathspec==1.1.1",
    "pexpect==4.9.0",
    "pip==26.1.2",
    "pip-api==0.0.34",
    "pip-audit==2.10.1",
    "pip-requirements-parser==32.0.1",
    "platformdirs==4.10.0",
    "pluggy==1.6.0",
    "ptyprocess==0.7.0",
    "py-serializable==2.1.0",
    "pycparser==3.0 ; implementation_name != 'PyPy' and platform_python_implementation != 'PyPy'",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "pygments==2.20.0",
    "pyjwt==2.13.0",
    "pyparsing==3.3.2",
    "pyproject-hooks==1.2.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "python-discovery==1.4.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.34.2",
