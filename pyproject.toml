    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "sse-starlette==3.4.4",
    "starlette==1.3.1",
    "tomli==2.4.1",
    "tomli-w==1.2.0",
    "tomlkit==0.15.0",
    "trove-classifiers==2026.6.1.19",
    "truststore==0.10.4",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "userpath==1.9.2",
    "uv==0.11.23",
    "uvicorn==0.49.0 ; sys_platform != 'emscripten'",
    "virtualenv==21.5.1",
    "vupi==0.0.11",
    "zipp==4.1.0 ; python_full_version < '3.12'",
]

[project.optional-dependencies]
test = [
    "hatch",
    "ruff",
    "mypy",
    "pip-audit",
    "deadcode",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "vupi",
]

[project.scripts]
deadcode = "deadcode.cli:main"

[project.urls]
homepage = "https://github.com/albertas/deadcode"
documentation = "https://deadcode.readthedocs.io/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[[tool.uv.index]]
name = "gitlab"
url = "https://gitlab.com/api/v4/projects/niekas%2Fpackages/packages/pypi/simple"

[tool.hatch.publish.index]  # Hatch docs: https://hatch.pypa.io/latest/config/build/
disable = false

[tool.hatch.build]
include = ["**/*.py"]
exclude = ["tests/**"]


[tool.ruff]  # https://beta.ruff.rs/docs/settings/
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one blank line before class
    "D213",    # multi line summary second line
    "COM812",  # missing trailing comma
    "ISC001",  # single line implicit string concatenation
    "A001",
    "ANN001",
    "ANN002",
    "ANN202",
    "ANN204",
    "ANN401",
    "ARG001",
    "ARG002",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D200",
    "D202",
    "D205",
    "D209",
    "D212",
    "D400",
    "D401",
    "D404",
    "D415",
    "D419",
    "ERA001",
    "FA100",
    "FBT001",
    "FBT002",
    "FBT003",
    "FIX002",
    "G004",
    "I001",
    "INP001",
    "N802",
    "PD011",
    "PGH003",
    "PLE0101",
    "PLR0124",
    "PLR0133",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW2901",
    "PT009",
    "PTH107",
    "PTH113",
    "PTH119",
    "PTH122",
    "PTH123",
    "RET501",
    "RET504",
    "RET505",
    "RET507",
    "RUF012",
    "RUF100",
    "S101",
    "SIM102",
    "SIM105",
    "SIM114",
    "T201",
    "TD002",
    "TD003",
    "TD005",
    "TRY300",
    "UP004",
    "UP015",
    "W293",
    "W605",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # allow assert and no docs in tests
    "PT009",
    "ANN201",
    "SLF001",  # tests legitimately read private members (e.g. visitor._log)
    "D",
]


[tool.mypy]
exclude = ["build", "dist", ".venv"]
python_version = "3.11"
strict = true
pretty = true
color_output = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true


[tool.isort]
profile = "black"
multi_line_output = 3
known_third_party = ["deadcode"]

[tool.deadcode]
ignore_names = [
    "ERROR_CODES",
    "fix",
    "fix_indent",
    "get_code_parts_for_the_same_line",
    "insert_code_if_character_is_not_removed",
    "remove_as_from_end",
    "remove_comma_from_begining",
    "ignore_definitions_if_decorated_with",
    "ignore_if_decorated_with",
    "ignore_if_inherits_from",
    "ignore_line",
    "ignore_names_if_decorated_with",
    "ignore_names_if_inherits_from",
    "ignore_bodies_of",
    "ignore_bodies_if_decorated_with",
    "ignore_bodies_if_inherits_from",
    "parse_noqa",
    "scoped_name",
    "show",
    "visit_*",
]
ignore_names_in_files = [
    "deadcode/utils/base_test_case.py"
]

exclude = ["tests"]

[tool.black]
max_line_length = 120
line_length = 120
target_version = ["py311"]


[tool.pytest.ini_options]
addopts = "--cov=deadcode --no-cov-on-fail --cov-fail-under=95.0"

[tool.coverage.run]
source = ["deadcode"]
omit = ["deadcode/utils/base_test_case.py"]

[tool.coverage.report]
# Coverage's default exclude already matches "# pragma: no cover";
# pragmas added in later phases are honored without further config.
