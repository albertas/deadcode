[package]
name = "deadcode"
version = "2.6.3"
edition = "2021"
description = "Native parser helpers for the deadcode command line tool"
license = "AGPL-3.0"

[lib]
name = "deadcode_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module", "py-clone"] }
ruff_python_parser = "0.0.22"
ruff_python_ast = "0.0.22"
ruff_text_size = "0.0.22"
